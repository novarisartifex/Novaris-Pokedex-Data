name: Publish verified Pokédex data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-data.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Android data source
        run: |
          git clone --depth 1 --branch data/v27-43-skin-tone https://github.com/novarisartifex/Novaris-Pokedex-Android.git android
          cd android
          cat native/v0.4.0/part*.b64 | base64 --decode > source.zip
          unzip -q source.zip -d appsrc
          gunzip -c Pokedex_V27_42.html.gz > Pokedex_V27_42.html
          python3 native/v0.5.5/update_content_v2743.py Pokedex_V27_42.html Pokedex_V27_43.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check lxml
      - name: Build and validate database package
        run: |
          python android/appsrc/tools/convert_pokedex.py android/Pokedex_V27_43.html pokedex.db.gzdata --version V27.43
          python - <<'PY'
          from pathlib import Path
          import gzip,sqlite3,hashlib,json,tempfile
          p=Path('pokedex.db.gzdata')
          assert p.stat().st_size>100000
          with tempfile.TemporaryDirectory() as t:
              db=Path(t)/'pokedex.db'
              with gzip.open(p,'rb') as src, db.open('wb') as dst:
                  import shutil
                  shutil.copyfileobj(src,dst)
              c=sqlite3.connect(db)
              assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert tables
              print('Validated tables:',sorted(tables))
              c.close()
          m={'schema_version':1,'channel':'stable','status':'published','latest':{'data_version':2743,'source_version':'V27.43','min_app_version_code':11,'url':'https://github.com/novarisartifex/Novaris-Pokedex-Data/releases/download/data-v2743/pokedex.db.gzdata','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size,'pokemon_count':1025}}
          Path('manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print('SHA256:',m['latest']['sha256'])
          PY
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-v2743 >/dev/null 2>&1 || gh release create data-v2743 pokedex.db.gzdata --title 'Novaris Pokédex data V27.43' --notes 'Versioned complete SQLite data package for compatible Novaris Android builds.'
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then git commit -m 'Publish verified V27.43 data manifest'; git push; fi
